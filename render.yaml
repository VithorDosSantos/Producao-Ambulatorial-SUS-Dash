services:
  # Backend FastAPI
  - type: web
    name: dashboard-sus-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_PAPA_HOST
        fromDatabase:
          name: dashboard-sus-db
          property: host
      - key: DB_PAPA_DATABASE
        fromDatabase:
          name: dashboard-sus-db
          property: database
      - key: DB_PAPA_USER
        fromDatabase:
          name: dashboard-sus-db
          property: user
      - key: DB_PAPA_PASSWORD
        fromDatabase:
          name: dashboard-sus-db
          property: password
      - key: DB_PAPA_PORT
        fromDatabase:
          name: dashboard-sus-db
          property: port
      - key: DB_ESPELHO_HOST
        fromDatabase:
          name: dashboard-sus-db
          property: host
      - key: DB_ESPELHO_DATABASE
        value: Espelho_siasus
      - key: DB_ESPELHO_USER
        fromDatabase:
          name: dashboard-sus-db
          property: user
      - key: DB_ESPELHO_PASSWORD
        fromDatabase:
          name: dashboard-sus-db
          property: password
      - key: DB_ESPELHO_PORT
        fromDatabase:
          name: dashboard-sus-db
          property: port

  # Frontend Vite/React
  - type: web
    name: dashboard-sus-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dashboard-sus-db
    databaseName: siasus_db
    user: dashboard_user
    plan: starter
